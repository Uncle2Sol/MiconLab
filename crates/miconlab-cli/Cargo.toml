[package]
name = "miconlab-cli"
version = "0.1.0"
edition = "2021"
description = "CLI for miconlab serial port assistant"
license = "PolyForm-Noncommercial-1.0.0"

[[bin]]
name = "miconlab-cli"
path = "src/main.rs"

[dependencies]
miconlab-core = { path = "../miconlab-core" }
clap = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
