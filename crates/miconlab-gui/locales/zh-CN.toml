"# Firmware Analysis Report (Readable)\n\n" = "# 固件解析报告（通俗版）\n\n"
"## App info (built-in)\n\n" = "## 二、应用信息（固件内置的自我介绍）\n\n"
"## Chip & Flash config\n\n" = "## 五、芯片与 Flash 配置（白话版）\n\n"
"## Embedded strings (classified)\n\n" = "## 七、固件里藏着的文字（自动分类）\n\n> 固件里通常嵌着调试文本、版本号、路径等，是了解固件用途的最好线索。\n\n"
"## Flash partition layout\n\n" = "## 三、Flash 是怎么划分的（分区表）\n\n> 分区表就像电脑的硬盘分区，把 Flash 划成多个区域各司其职。\n\n"
"## Frameworks\n\n" = "## 六、用了哪些框架/组件？\n\n"
"## Health check\n\n" = "## 八、健康检查\n\n"
"## Segments\n\n" = "## 四、程序结构（代码段布局）\n\n> 固件由多个“段”组成，芯片启动时把它们加载到内存的不同区域。\n\n"
"## What is this?\n\n" = "## 一、这是什么？\n\n"
"<< No I2C devices found\n" = "<< 未发现 I2C 设备\n"
"> Auto-generated readable report; use 'Export Disasm' for full instruction-level analysis.\n" = "> 💡 本报告为自动生成的通俗解读；需要逐条指令的深度分析请使用「导出反汇编」。\n"
"AI chat is not enabled.\nThis feature requires reqwest + tokio. Build with `llm-online` feature.\n\nThe core AI engine (protocol recognition, anomaly detection, diagnosis) is always available offline." = "AI 对话功能未启用。\n该功能需要 reqwest + tokio 依赖，编译时启用 `llm-online` feature。\n\n核心 AI 引擎（协议识别、异常检测、诊断）始终可用且离线工作。"
"Connect then Start Stream\n(auto: self-test → battery → start)" = "连接设备后点击「启动数据流」\n（自动发送 自检→电量→启动）"
"Disassemble firmware into editable compilable assembly project\n(.s + .ld + Makefile). Rebuild with arm-none-eabi-gcc" = "将固件反汇编为可编辑可编译的汇编工程（.s + .ld + Makefile）\n生成后可用 arm-none-eabi-gcc 编译为 .bin/.hex 重新烧录"
"Enter any SLCAN command (e.g. O=open, C=close, S8=set 500Kbps, t1L8D...=send standard frame). Trailing \\r is auto-appended on send" = "输入任意 SLCAN 命令（如 O=打开、C=关闭、S8=设置 500Kbps、t1L8D...=发送标准帧），命令末尾无需加 \\r，发送时自动补齐"
"Frame: A5 5A | cmd | len(LE) | data | CRC16-Modbus\nSensor frame 28B @100fps (20× 8bit ADC)" = "协议：A5 5A | cmd | len(LE) | data | CRC16-Modbus\n传感器帧 28B @100fps（20 点 8bit ADC）"
"Frame: AA 55 03 99 dual auto-detect\nBaud 921600, auto-streaming" = "协议：AA 55 03 99 双协议自动识别（新固件 556B / 旧固件分包）\n波特率 921600，设备自主流式发送"
"Frame: [AA 55 03 99] [Type] [SeqTag] [Payload]\nPacket1 (Type=0x01): 128B ADC 1st half\nPacket2 (Type=0x02): 128B ADC 2nd half + 16B IMU quaternion\nComplete: 256B ADC (16×16 grid) + 16B IMU (w,x,y,z float32 LE)" = "帧格式: [AA 55 03 99] [Type] [SeqTag] [Payload]\nPacket1 (Type=0x01): 128B ADC 前半帧\nPacket2 (Type=0x02): 128B ADC 后半帧 + 16B IMU 四元数\n完整帧: 256B ADC (16×16 矩阵) + 16B IMU (w,x,y,z float32 LE)"
"Line ending appended on send: None, CR=\\r (old Mac), LF=\\n (Unix/Linux), CRLF=\\r\\n (Windows/Modbus RTU)" = "发送数据时追加的行尾：None 不追加、CR=\\r（旧 Mac）、LF=\\n（Unix/Linux）、CRLF=\\r\\n（Windows/Modbus RTU）"
"No conversation yet. Type a question below, e.g.:\n• Analyze this HEX data protocol\n• How to read version after STM32 Bootloader 0x7F sync\n• How to calculate Modbus RTU CRC16" = "暂无对话。在下方输入框输入问题，例如：\n• 帮我分析这段 HEX 数据的协议\n• STM32 Bootloader 0x7F 同步后应该如何读取版本\n• Modbus RTU 的 CRC16 如何计算"
"No recording data (recording in progress or empty)" = "无可用记录（设备正在记录或记录为空）"
"PROBES 7-step loop: Observe → Hypothesize → Design → Send → Verify → Summarize → Update.\nStructured diagnosis without online LLM." = "基于 PROBES 7 步闭环模型（观察→假设→设计命令→发送→验证→归纳→更新知识库），\n提供结构化诊断建议，无需在线 LLM。"
"Parsed recording is empty" = "记录数据解析为空"
"Recommended: Download bitstream / read config Flash via JTAG\n  Note: Requires dedicated JTAG adapter (e.g. FT2232H), miconlab currently supports UART only" = "推荐操作：通过 JTAG 直接下载 bitstream / 读取配置 Flash\n  注意：需要专用 JTAG 适配器（如 FT2232H），miconlab 目前仅支持 UART 烧录\n  建议：使用专用的 FPGA 下载工具（如 iMPACT、Quartus Programmer）"
"Recommended: GD32 is STM32-compatible, reuse STM32 flow\n  1. Set BOOT0=H, BOOT1=L, reset to enter Bootloader\n  2. Select GD32 in Flasher, send 0x7F\n  3. Read / erase / write firmware" = "推荐操作：GD32 兼容 STM32 协议，复用 STM32 流程\n  1. 将 BOOT0 拉高、BOOT1 拉低，复位进入 Bootloader\n  2. 在烧录器面板选择 GD32，发送 0x7F 唤醒\n  3. 读取 / 擦除 / 写入固件"
"Recommended: PIC ICSP requires PicKit/ICD programmer\n  Note: UART cannot drive ICSP timing (PGC/PGD)\n  This panel shows command sequence only, use MPLAB IPE for real flashing" = "推荐操作：PIC ICSP 需 PicKit/ICD 等专用编程器\n  注意：UART 无法直接驱动 ICSP 时序（PGC/PGD）\n  本面板仅展示命令序列，实际烧录请使用 MPLAB IPE"
"Recommended: Read/erase/flash via ESP8266 ROM Bootloader\n  1. Hold GPIO0 low and reset to enter download mode\n  2. Select ESP8266 in Flasher, click Sync\n  3. Read Flash / erase / write firmware" = "推荐操作：通过 ESP8266 ROM Bootloader 读取/擦除/刷写\n  1. 拉低 GPIO0 并复位进入下载模式\n  2. 在烧录器面板选择 ESP8266，点击「同步」\n  3. 读取 Flash / 擦除 / 写入固件"
"Recommended: Read/erase/flash via NXP LPC ISP (UM10295)\n  1. Hold P0.14 low on reset to enter ISP mode\n  2. Select NXP LPC in Flasher, click Sync (?)\n  3. Unlock → Prepare sectors → Erase / Write / Read" = "推荐操作：通过 NXP LPC ISP (UM10295) 读取/擦除/刷写\n  1. 复位时拉低 P0.14 进入 ISP 模式\n  2. 在烧录器面板选择 NXP LPC，点击「同步 (?)」\n  3. 解锁 → 准备扇区 → 擦除 / 写入 / 读取"
"Recommended: Read/erase/flash via ROM Bootloader (SLIP SYNC)\n  1. Hold GPIO0 low and reset (or hold BOOT) to enter download mode\n  2. Select ESP32 in Flasher, send SYNC\n  3. Read SPI Flash / erase / write / MD5 verify" = "推荐操作：通过 ROM Bootloader（SLIP SYNC）读取/擦除/刷写\n  1. 拉低 GPIO0 并复位（或按住 BOOT 键）进入下载模式\n  2. 在烧录器面板选择 ESP32，发送 SYNC (07 07 12 20...)\n  3. 读取 SPI Flash / 擦除 / 写入固件 / MD5 校验"
"Recommended: Read/erase/flash via STM8 UART Bootloader (UM0560)\n  1. Pull SWIM low to enter UART Bootloader\n  2. Select STM8 in Flasher, send 0x7F\n  3. Read / erase / write firmware" = "推荐操作：通过 STM8 UART Bootloader (UM0560) 读取/擦除/刷写\n  1. 拉低 SWIM 进入 UART Bootloader 模式\n  2. 在烧录器面板选择 STM8，发送 0x7F 唤醒\n  3. 读取 / 擦除 / 写入固件"
"Recommended: Read/erase/flash via UART Bootloader (0x7F wakeup)\n  1. Set BOOT0=H, BOOT1=L, reset to enter System Bootloader\n  2. Select STM32 in Flasher, send 0x7F\n  3. Read (backup) / erase / write firmware" = "推荐操作：通过 UART Bootloader（0x7F 唤醒）读取固件 / 擦除 / 刷写\n  1. 将 BOOT0 拉高、BOOT1 拉低，复位进入系统存储 Bootloader\n  2. 在烧录器面板选择 STM32，发送 0x7F 唤醒\n  3. 读取（备份）/ 擦除 / 写入固件"
"Recommended: Read/erase/flash via WCH ISP protocol (0x57 0xAB)\n  1. CH32 uses WCH ISP protocol over USB/UART\n  2. Select CH32 in Flasher, click Identify\n  3. Read Chip ID → Erase / Write / Verify / Reset" = "推荐操作：通过 WCH ISP 协议 (0x57 0xAB) 读取/擦除/刷写\n  1. CH32 通过 USB 或串口使用 WCH ISP 协议\n  2. 在烧录器面板选择 CH32，点击「识别」\n  3. 读 Chip ID → 擦除 / 写入 / 校验 / 复位"
"Recommended: Read/write Flash via SWD\n\n⚠ Important:\n  • Identified as generic ARM Cortex-M3 core (manufacturer: ARM, not vendor-specific)\n  • SWD requires adapter (ST-Link, J-Link), miconlab currently supports UART only\n  • Generic Cortex-M3 could be STM32 / GD32 / CH32 / LPC1768 from any vendor\n  • Click button below to confirm chip model, then jump to corresponding flasher\n  • If chip supports UART Bootloader (e.g. STM32/GD32/CH32), switch to UART mode" = "推荐操作：通过 SWD 直接读写 Flash\n\n⚠ 重要说明：\n  • 当前识别为通用 ARM Cortex-M3 内核（制造商：ARM），非特定芯片厂商\n  • SWD 直连需要 SWD 适配器（如 ST-Link、J-Link），miconlab 目前仅支持 UART Bootloader 烧录\n  • 通用 Cortex-M3 可能是 STM32 / GD32 / CH32 / LPC1768 等任一厂商芯片\n  • 点击下方按钮将弹出芯片型号确认对话框，选择实际芯片型号后跳转对应烧录器\n  • 若芯片支持 UART Bootloader（如 STM32/GD32/CH32），可切换到 UART 方式"
"Recommended: Use SD Card Image Flasher (RPi/Jetson Nano)\n  1. Select SBC SD Card Image in Flasher\n  2. Scan Disks → select SD device → select image file\n  3. Unmount → Flash Image → Eject" = "推荐操作：使用 SD 卡镜像烧录功能（树莓派/Jetson Nano 等）\n  1. 在烧录器面板选择「开发板 SD 卡镜像」\n  2. 扫描磁盘 → 选择 SD 卡设备 → 选择镜像文件\n  3. 卸载 SD → 烧录镜像 → 弹出 SD"
"Recording download timeout (3 retries)" = "记录下载超时（重试 3 次无应答）"
"SWD (Serial Wire Debug) uses the same IDCODE format as JTAG.\nRead DPIDR register via SWD protocol to identify chip.\nARM Cortex-M Part Number starts with 0xBA: 0xBA95=M3, 0xBA01=M0+, 0xBA04=M4, 0xBA07=M7" = "SWD（Serial Wire Debug）使用与 JTAG 相同的 IDCODE 格式。\n通过 SWD 协议读取 DPIDR 寄存器（Debug Port ID Register）识别芯片。\nARM Cortex-M 系列的 Part Number 以 0xBA 开头：0xBA95=M3、0xBA01=M0+、0xBA04=M4、0xBA07=M7"
"Send the typed SLCAN command to the CAN adapter (serial connection required). \\r is auto-appended" = "将输入的 SLCAN 命令发送给 CAN 适配器（需先连接串口）。命令末尾自动补 \\r"
"The three pressure-sensing devices use completely different protocols, frame lengths and baud rates.\nPick a device to enter its own workspace; each device keeps its own port and baud rate." = "三台压力传感设备的协议、帧长与波特率完全不同。先选设备，再进入独立工作区：\n每台设备各自保存端口与波特率，互不继承、互不干扰。"
"This page scans firmware binary to extract peripheral config:\n• DMA: search DMA register addresses, correlate with peripheral DR\n• IRQ: parse ARM vector table [16+], filter default handlers\n• GPIO: search MODER register references\n\nConflicts in red, matches in green." = "本页面通过启发式扫描固件二进制得出外设配置：\n• DMA 通道：搜索 DMA 寄存器地址常量，关联附近的外设数据寄存器\n• 中断向量表：解析 ARM 向量表 [16+] 外设 IRQ，过滤默认空 handler\n• GPIO：搜索 MODER 寄存器地址引用\n\n冲突项以红色高亮，匹配项以绿色显示。"
"Tip: Auto-detect sends multiple probe commands (Modbus, SLCAN, AT, SCPI, etc.) \\\n                         in sequence. Ensure the device is powered and connected to the correct port." = "提示：自动侦测会依次发送多种探测命令（Modbus、SLCAN、AT、SCPI 等），\\\n                         请确保设备已上电并连接到正确的串口。"
"Tip: For linear sensors prefer Two-Point or Linear Fit. \\\n                         If the sensor response is non-linear (e.g. thermistor, capacitive), \\\n                         use Polynomial fit (typically degree 2-3 is sufficient)." = "选用建议：传感器线性良好时优先使用「两点校准」或「线性拟合」；\\\n                         若传感器响应存在明显非线性（如热敏电阻、电容式传感器），\\\n                         使用「多项式拟合」（一般 2~3 阶即可）。"
"Vector table is the interrupt entry table for ARM Cortex-M, located at Flash base.\n[0] Initial SP — determines RAM usage\n[1] Reset Handler — first instruction after power-on\n[2-15] System exceptions: NMI/HardFault/BusFault etc.\n[16+] Peripheral IRQs: IRQ0~IRQn" = "向量表是 ARM Cortex-M 芯片的中断入口表，位于 Flash 起始地址。\n[0] 初始栈指针 (SP) — 决定 RAM 使用量\n[1] 复位向量 — 芯片上电后执行的第一条指令地址\n[2-15] 系统异常：NMI/HardFault/BusFault 等\n[16+] 外设中断：IRQ0~IRQn\n\n修改 SP 和 Reset Handler 可以改变固件的执行入口。"
"Warning: PIC ICSP requires PicKit/ICD programmer. UART cannot drive ICSP timing.\n  This panel shows command sequence only, use MPLAB IPE for real flashing" = "⚠ PIC ICSP 需 PicKit/ICD 等专用编程器，UART 无法直接驱动 ICSP 时序\n  本面板仅展示命令序列，实际烧录请使用 MPLAB IPE"
"no quality issues" = "无质量问题"
"• Baud: 921600 (default; alt 9600/115200/256000/460800/1500000/3000000)\n• 8N1, no flow control\n• Form A: 14×8=112 physical sensors (28×8 interpolated view)\n• Form B: 14-row variable-column layout, up to 131 sensors\n• Sync by header AA 55 03 99 only, no CRC/checksum\n• Dual-packet: Packet1 (0x01) + Packet2 (0x02) paired by SeqTag\n• IMU at Packet2 tail, 16 bytes (w,x,y,z float32 LE)" = "• 波特率: 921600 (默认；可选 9600/115200/256000/460800/1500000/3000000)\n• 数据位 8 / 校验 None / 停止位 1 / 无流控\n• 传感器形态 A: 14×8=112 物理传感器（28×8 插值显示）\n• 传感器形态 B: 14 行变列布局，最大 131 个传感器\n• 同步依赖帧头 AA 55 03 99，无 CRC/校验和\n• 双包结构：Packet1 (0x01) + Packet2 (0x02) 通过 SeqTag 匹配\n• IMU 数据位于 Packet2 末尾 16 字节 (w,x,y,z float32 LE)"
"▸ DTR/RTS Trigger:\nSTM32/GD32: RTS=BOOT0(high), DTR=RESET(low→high pulse)\nESP32: DTR=GPIO0(low), RTS=RESET(low→high pulse)\nIf only TX/RX/GND connected, DTR/RTS won't work, manual Boot mode required" = "▸ DTR/RTS 触发说明:\nSTM32/GD32: RTS=BOOT0(高), DTR=RESET(低→高脉冲)\nESP32: DTR=GPIO0(低), RTS=RESET(低→高脉冲)\n若设备只连接 TX/RX/GND，DTR/RTS 触发无效，需手动进入 Boot 模式"
"✓ Connected {} ({:04X}:{:04X}) - MCU native USB CDC\n  Note: MCU native USB. Supports USB Bootloader if available (STM32 DFU/ESP32 USB-Download)" = "✓ 已连接 {} ({:04X}:{:04X}) - MCU 原生 USB CDC\n  注意：此为 MCU 原生 USB，非桥接芯片。若芯片支持 USB Bootloader（如 STM32 DFU/ESP32 USB-Download），可直接烧录"
"✓ Connected {} ({:04X}:{:04X}) - USB-Serial bridge\n  Supports UART Bootloader flashing (STM32/GD32/CH32/ESP32/Arduino etc.)" = "✓ 已连接 {} ({:04X}:{:04X}) - USB 转串口桥接\n  支持 UART Bootloader 烧录（STM32/GD32/CH32/ESP32/Arduino 等）"

